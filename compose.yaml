services:
  server:
    build: { context: ., target: server }
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      PUBLIC_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    volumes: ["whiteboard-data:/data"]
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [server]

volumes:
  whiteboard-data:
